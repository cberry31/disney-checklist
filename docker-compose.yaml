version: "3"
services:
  disney-checklist-server:
    build:
      dockerfile: Dockerfile
      context: ./server
    container_name: disney-checklist-server
    ports:
      - "8080:8080"
    environment:
      - LOGGING_LEVEL=DEBUG
    volumes:
      - ./server/data:/app/data
    restart: always

  disney-checklist-client:
    build:
      dockerfile: Dockerfile
      context: ./frontend
    container_name: disney-checklist-client
    ports:
      - "5500:5500"
    depends_on:
      - disney-checklist-server
    environment:
      - API_URL=http://disney-checklist-server:8080
    restart: always

  mongodb:
    image: mongo:latest
    container_name: local_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=supersecretpassword
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local

